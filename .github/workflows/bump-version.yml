name: Bump version

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.toc'

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip version]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update SetRevision in changed lua files
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
          STAMP=$(git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "${{ github.sha }}")
          echo "stamp $STAMP"
          git diff --name-only "$BEFORE" "${{ github.sha }}" -- '*.lua' | python3 -c '
          import os, re, sys
          stamp = sys.argv[1].encode()
          for f in sys.stdin.read().split():
              if os.path.isfile(f):
                  src = open(f, "rb").read()
                  nsrc, n = re.subn(rb"SetRevision\(\"[0-9]+\"\)", b"SetRevision(\"" + stamp + b"\")", src)
                  if n and nsrc != src:
                      open(f, "wb").write(nsrc)
                      print("revision", f)
          ' "$STAMP"

      - name: Bump version stamps
        run: |
          NOW=$(date -u +%Y%m%d%H%M%S)
          python3 -c '
          import glob, re, sys
          now = sys.argv[1]
          def bumped_ver(ver):
              core, *suffix = ver.split("-", 1)
              nums = core.split(".")
              nums[-1] = str(int(nums[-1]) + 1)
              return ".".join(nums) + ("-" + suffix[0] if suffix else "")
          def bump(m):
              return m.group(0)[:m.start(1) - m.start(0)] + bumped_ver(m.group(1))
          targets = sorted(glob.glob("**/*.toc", recursive=True))
          targets.append("DBM-Core/DBM-Core.lua")
          for f in targets:
              src = open(f).read()
              nsrc, n = re.subn(r"(?:## Version: |DisplayVersion = \")([^\"\s]+)", bump, src)
              nsrc, n2 = re.subn(r"parseCurseDate\(\"\d+\"\)", "parseCurseDate(\"%s\")" % now, nsrc)
              if n + n2:
                  open(f, "w").write(nsrc)
                  print("bumped", f)
          ' "$NOW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- '*.toc' '*.lua')" ]; then
            echo "no version change"
            exit 0
          fi
          git add -- '*.toc' '*.lua'
          git commit -m "Bump addon version [skip version]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push failed, retry $i"
            sleep 5
          done
